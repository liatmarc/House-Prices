name: Refresh Results

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'lasso_house_prices.py'
      - 'requirements.txt'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt kaggle tabulate

      - name: Verify Kaggle secrets are present
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          test -n "${KAGGLE_USERNAME}" && echo "KAGGLE_USERNAME is set" || (echo "ERROR: KAGGLE_USERNAME missing"; exit 1)
          test -n "${KAGGLE_KEY}" && echo "KAGGLE_KEY is set" || (echo "ERROR: KAGGLE_KEY missing"; exit 1)

      - name: Configure Kaggle API
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          kaggle --version

      - name: Check competition access (must accept rules on Kaggle)
        run: |
          kaggle competitions files -c house-prices-advanced-regression-techniques

      - name: Download dataset from Kaggle
        run: |
          mkdir -p data
          kaggle competitions download -c house-prices-advanced-regression-techniques -p data --force
          unzip -o data/house-prices-advanced-regression-techniques.zip -d data
          ls -lh data

      - name: Run pipeline
        run: |
          python lasso_house_prices.py --data-dir data

      - name: Commit results if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-refresh results [skip ci]"
            git push
          fi

